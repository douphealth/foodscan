name: FoodScan 11.18 Classic Report & Accuracy
on:
  push:
    branches: [main, qa/release-11.18.0]
    paths:
      - 'assets/release-11.18.0/**'
      - 'index.html'
      - '_headers'
      - 'sw.js'
      - 'qa/foodscan-11.18*'
      - '.github/workflows/foodscan-11.18.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-default-type=module qa/foodscan-11.18.mjs
      - run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/foodscan-qa.log 2>&1 &
          sleep 2
          node qa/foodscan-11.18-browser.mjs
