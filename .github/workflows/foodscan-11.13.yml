name: FoodScan 11.13 regression and visual smoke
on:
  push:
    branches: [main, qa/release-11.13.0]
    paths:
      - 'assets/release-11.13.0/**'
      - 'index.html'
      - '_headers'
      - 'sw.js'
      - 'qa/foodscan-11.13.mjs'
      - 'qa/foodscan-11.13-browser.mjs'
      - '.github/workflows/foodscan-11.13.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source, safe fallback and CSP
        run: node --experimental-default-type=module qa/foodscan-11.13.mjs
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Browser comparison and classification tests
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/foodscan-test-server.log 2>&1 &
          sleep 2
          node qa/foodscan-11.13-browser.mjs
      - name: Preserve mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foodscan-11.13-browser-screenshots
          path: ui-audit/11.13
          retention-days: 7
