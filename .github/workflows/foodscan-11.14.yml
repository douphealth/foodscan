name: FoodScan 11.14 visual regression
on:
  push:
    branches: [main, qa/release-11.14.0]
    paths:
      - 'assets/release-11.14.0/**'
      - 'index.html'
      - '_headers'
      - 'sw.js'
      - 'qa/foodscan-11.14*'
      - '.github/workflows/foodscan-11.14.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-default-type=module qa/foodscan-11.14.mjs
      - run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Test responsive product, portion and alternative reports
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/foodscan-11.14-server.log 2>&1 &
          sleep 2
          node qa/foodscan-11.14-browser.mjs
      - name: Preserve report screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foodscan-11.14-responsive
          path: ui-audit/11.14
          retention-days: 7
