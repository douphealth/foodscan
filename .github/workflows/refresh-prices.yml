name: Refresh prices

# Rebuilds the FoodScan price data every day and publishes it to the `prices-data` branch:
#   seeds/*.json  the four source files (observatory, e-katanalotis, Bazaar, Lidl), each observation with its own date
#   e-NN.json     labelled estimates for barcodes with no recorded price
#   manifest.json calibration of the estimator and the build time
#   op/           Open Prices snapshot: per-barcode observations of the last 120 days from the official daily dumps, and the
#                 cutoff after which the worker asks the live API (one request per scan)
# The site (Cloudflare Pages worker) reads this branch and uses the NEWER of the bundled and the published copy, so prices stay
# current WITHOUT redeploying. If the branch is missing, older, incomplete or unreachable the bundled data is used.
# Files live in the folder `price-refresh/` of the repository (refresh/, tools/, data/seeds/).
on:
  schedule:
    - cron: '37 2 * * *'      # 02:37 UTC every day (after the ministry's daily file, before Greek shops open)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    defaults:
      run:
        working-directory: price-refresh
    steps:
      - uses: actions/checkout@v4

      - name: Previous data (carried forward when a source is unavailable)
        uses: actions/checkout@v4
        with:
          ref: prices-data
          path: price-refresh/prev
          fetch-depth: 1
        continue-on-error: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Open Food Facts extract (names, sizes, categories; refreshed weekly)
        uses: actions/cache@v4
        with:
          path: price-refresh/work/off-extract.json
          key: off-extract-${{ github.run_id }}
          restore-keys: off-extract-

      - name: Linker and quarantine tests
        run: node --test refresh/test/pricelink.test.mjs

      - name: Refresh
        run: node refresh/scripts/refresh-prices.mjs --work work --out out --prev prev

      - name: Open Prices snapshot (official daily dumps, ODbL; keeps the previous snapshot if a download fails or looks incomplete)
        run: node tools/build-open-prices.mjs --out out/op --prev prev/op
        # the Greek data above must publish even if Open Prices is unreachable on the first run (no previous snapshot to keep)
        continue-on-error: true

      - name: Publish to prices-data
        run: |
          cd out
          git init -q
          git checkout -q -b prices-data
          git add -A
          git -c user.name="foodscan-refresh" -c user.email="refresh@users.noreply.github.com" commit -q -m "prices $(date -u +%F)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" prices-data
