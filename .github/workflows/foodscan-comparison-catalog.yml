name: FoodScan Source-backed Comparison Catalog
on:
  push:
    branches: [qa/alternatives-11.19.0]
    paths:
      - 'scripts/build-comparison-catalog.mjs'
      - '.github/workflows/foodscan-comparison-catalog.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 3 * * *'
permissions:
  contents: write
concurrency:
  group: foodscan-catalog-update
  cancel-in-progress: false
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update real Open Food Facts category records
        run: node scripts/build-comparison-catalog.mjs
      - name: Commit source data only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/alternatives
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified Open Food Facts comparison catalog'
            git push
          fi
