name: FoodScan 11.17 sparse-record integrity
on:
  push:
    branches: [main, qa/release-11.17.0]
    paths:
      - '_worker.js'
      - 'index.html'
      - '_headers'
      - 'sw.js'
      - 'assets/release-11.17.0/**'
      - 'qa/foodscan-11.17*'
      - '.github/workflows/foodscan-11.17.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-default-type=module qa/foodscan-11.17.mjs
      - run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/foodscan-11.17.log 2>&1 &
          sleep 2
          node qa/foodscan-11.17-browser.mjs
