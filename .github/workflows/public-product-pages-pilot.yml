name: Public product pages pilot
on:
  pull_request:
    paths:
      - 'seo-products/**'
      - '.github/workflows/public-product-pages-pilot.yml'
  push:
    branches: [feature/public-product-pages-pilot]
    paths:
      - 'seo-products/**'
      - '.github/workflows/public-product-pages-pilot.yml'
permissions:
  contents: read
jobs:
  renderer-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run isolated renderer tests
        working-directory: seo-products
        run: npm test
