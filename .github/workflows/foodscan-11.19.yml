name: FoodScan 11.19 Alternative Recovery Regression
on:
  push:
    branches: [qa/alternatives-11.19.0, main]
    paths:
      - 'assets/release-11.19.0/**'
      - '_worker.js'
      - 'index.html'
      - 'sw.js'
      - '_headers'
      - 'qa/foodscan-11.19*'
      - '.github/workflows/foodscan-11.19.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-default-type=module qa/foodscan-11.19.mjs
      - run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/foodscan-11.19.log 2>&1 &
          sleep 2
          node qa/foodscan-11.19-browser.mjs
