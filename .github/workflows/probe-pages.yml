name: Probe chain product pages (one-off, read-only)
# Runs only when the probe itself is pushed to this branch. Per site: robots.txt, sitemaps, at most 3 allowed product pages (<= 12 requests, 1.5 s apart). Writes nothing.
on:
  push:
    branches: [claude/confident-dirac-gzvl8m]
    paths:
      - 'price-refresh/probe/probe-pages.mjs'
      - '.github/workflows/probe-pages.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node price-refresh/probe/probe-pages.mjs
